<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rust Farm</title>
<style>
:root{--bg:#0e1116;--fg:#f2efe6;--ac:#ff9a2e;--panel:rgba(14,17,22,.68)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
svg{display:block}
#cross{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none}
#cross i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);border-radius:1px;transition:background .1s}
#cross .t{width:2px;height:7px;left:-1px;top:-13px}#cross .b{width:2px;height:7px;left:-1px;top:6px}
#cross .l{width:7px;height:2px;left:-13px;top:-1px}#cross .r{width:7px;height:2px;left:6px;top:-1px}
#cross .d{width:2px;height:2px;left:-1px;top:-1px}
#cross.hit i{background:var(--ac)}
#toast{position:fixed;left:50%;top:58%;transform:translateX(-50%);font-weight:700;font-size:20px;color:var(--ac);text-shadow:0 1px 3px #000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#buffs{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;font-size:12px;pointer-events:none}
#buffs span{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid;border-radius:4px;padding:3px 8px}
#buffs b{width:8px;height:8px;border-radius:50%}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.hs{position:relative;width:56px;height:56px;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:5px;display:flex;align-items:center;justify-content:center}
.hs.on{border-color:var(--ac);box-shadow:0 0 8px rgba(255,154,46,.5)}
.hs u{position:absolute;left:4px;top:2px;font-size:10px;text-decoration:none;opacity:.6}
.hs i,.sl i{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:10px;font-weight:700;color:var(--ac)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,16,.72);text-align:center;cursor:pointer}
#ov h1{font-size:44px;margin:0 0 8px;letter-spacing:.04em;color:var(--ac)}#ov p{margin:4px;opacity:.85}
.bd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.6);backdrop-filter:blur(3px)}
.box{background:rgba(22,26,33,.96);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:18px 22px;max-width:94vw;max-height:88vh;overflow:auto}
.box h2{margin:0 0 12px;font-size:20px}
#grid{display:grid;grid-template-columns:repeat(6,72px);gap:6px}
.sl{position:relative;height:72px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.sl.hb{border-color:rgba(255,154,46,.5)}.sl.sel{outline:2px solid var(--ac);background:rgba(255,154,46,.18)}
.sl u{position:absolute;left:4px;top:2px;font-size:9px;opacity:.6;text-decoration:none}
.ic{width:30px;height:27px;clip-path:polygon(15% 12%,60% 0,100% 30%,90% 80%,50% 100%,5% 78%)}
.gm{display:inline-block;width:14px;height:12px;clip-path:polygon(15% 12%,60% 0,100% 30%,90% 80%,50% 100%,5% 78%)}
.rc{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);min-width:310px}
.ri{display:flex;align-items:center;gap:10px;flex:1;font-size:15px}
.rp{display:flex;align-items:center;gap:5px;font-size:14px;min-width:70px;justify-content:flex-end}
.rc button{background:var(--ac);color:#111;border:0;border-radius:5px;padding:6px 14px;cursor:pointer;font-weight:700}
.rc button:disabled{background:#444;color:#999;cursor:default}
#shopBtn{display:none;position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ac);color:#111;font-weight:700;padding:10px 18px;border-radius:8px;box-shadow:0 2px 10px #0008;cursor:pointer}
#tc{display:none}
#joy{display:none;position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:none}
#knob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(14,17,22,.55);border:2px solid rgba(255,255,255,.35);color:#fff}
#bHit{right:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:88px;height:88px;font-size:34px;background:rgba(255,154,46,.55)}
#bJump{right:128px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;font-size:22px}
#bInv{right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:50px;height:50px;font-size:22px}
#bar.tbar{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
#bar.tbar .hs{width:40px;height:40px}#bar.tbar svg{transform:scale(.75)}
@media(max-width:520px){#grid{grid-template-columns:repeat(6,48px);gap:4px}.sl{height:48px}.sl svg{transform:scale(.75)}.rc{min-width:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
<div id="toast"></div><div id="buffs"></div><div id="bar"></div>
<div id="shopBtn" onclick="openShop()">Shop [E]</div>
<div id="inv" class="bd"><div class="box"><h2>Inventory</h2><div id="grid"></div></div></div>
<div id="shop" class="bd"><div class="box" id="shopBox"></div></div>
<div id="ov"><h1>RUST FARM</h1><p>Click to play</p></div>
<div id="tc"><div id="joy"><div id="knob"></div></div><div id="bHit" class="tb">⛏️</div><div id="bJump" class="tb">▲</div><div id="bInv" class="tb">🎒</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE, cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputEncoding=T.sRGBEncoding;
const scene=new T.Scene();scene.background=new T.Color(0x9cc7e8);scene.fog=new T.Fog(0x9cc7e8,40,190);
const cam=new T.PerspectiveCamera(70,1,.1,400);scene.add(cam);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new T.HemisphereLight(0xcfe6ff,0x4a5a3a,.8));
const sun=new T.DirectionalLight(0xfff0d0,1.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-45;sc.right=sc.top=45;sc.far=200;sun.shadow.bias=-.0005;scene.add(sun,sun.target);

// terrain (flat plateau around the shop in the center)
const H0=(x,z)=>Math.sin(x*.02)*4+Math.cos(z*.025)*4+Math.sin((x+z)*.05)*2.5+Math.sin(x*.09)*Math.cos(z*.08);
const H=(x,z)=>{const d=Math.hypot(x,z),w=d<6?1:d>12?0:1-(d-6)/6,s=w*w*(3-2*w);return H0(x,z)*(1-s)+H0(0,0)*s};
const WATER=-3.5;
{
  const g=new T.PlaneGeometry(400,400,160,160);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,col=[],c=new T.Color();
  for(let i=0;i<p.count;i++){
    const y=H(p.getX(i),p.getZ(i));p.setY(i,y);const n=Math.random()*.06;
    if(y<WATER+1)c.setHSL(.12,.45,.55+n);else if(y>8)c.setHSL(.08,.1,.45+n);else c.setHSL(.27-y*.004,.5,.3+n);
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.computeVertexNormals();
  const t=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true}));t.receiveShadow=true;scene.add(t);
  const w=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshPhongMaterial({color:0x2a6f9e,transparent:true,opacity:.8,shininess:90}));
  w.rotation.x=-Math.PI/2;w.position.y=WATER;scene.add(w);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function spot(){for(;;){const x=rnd(-180,180),z=rnd(-180,180),y=H(x,z);if(y>WATER+.8&&Math.hypot(x,z)>12)return[x,y,z]}}
const rock=c=>new T.MeshStandardMaterial({color:c,roughness:.95,metalness:0,flatShading:true});
const M={trunk:new T.MeshLambertMaterial({color:0x5a3b22}),leaf:[0x2f6b2f,0x3a7d34,0x275a2a].map(c=>new T.MeshLambertMaterial({color:c,flatShading:true})),
 s:rock(0x8d8d88),m:rock(0x9a5b2e),f:rock(0xd6c640)};
const objs=[],all=[],trees=[],blocks=[];

for(let i=0;i<150;i++){ // decor trees
  const [x,y,z]=spot(),g=new T.Group();g.position.set(x,y,z);
  const h=rnd(4,7),tr=new T.Mesh(new T.CylinderGeometry(.3,.45,h,7),M.trunk);tr.position.y=h/2;g.add(tr);
  for(let k=0;k<3;k++){const c=new T.Mesh(new T.ConeGeometry(2.4-k*.6,3,8),M.leaf[k%3]);c.position.y=h-.5+k*1.5;g.add(c)}
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});g.rotation.y=rnd(0,6.28);scene.add(g);trees.push(g);
}

// weak spot flare
const tex=fn=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');fn(x);return new T.CanvasTexture(c)};
const FLARE=tex(x=>{x.globalCompositeOperation='lighter';
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,235,1)');g.addColorStop(.12,'rgba(255,225,140,.95)');g.addColorStop(.35,'rgba(255,150,40,.35)');g.addColorStop(1,'rgba(255,120,20,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  [0,Math.PI/2,.62,-.62].forEach((a,i)=>{x.save();x.translate(64,64);x.rotate(a);const l=x.createLinearGradient(-64,0,64,0);
    l.addColorStop(0,'rgba(255,200,120,0)');l.addColorStop(.5,'rgba(255,240,200,'+(i<2?.9:.55)+')');l.addColorStop(1,'rgba(255,200,120,0)');
    x.fillStyle=l;x.fillRect(-64,-1.3,128,2.6);x.restore()})});
const HALO=tex(x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,170,60,.9)');g.addColorStop(.4,'rgba(255,120,30,.35)');g.addColorStop(1,'rgba(255,100,20,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});
const RC2=new T.Raycaster(),ZV=new T.Vector3(0,0,1),YV=new T.Vector3(0,1,0);
function reMark(g,wp){
  g.updateMatrixWorld(true);const u=g.userData,body=g.children[0];
  const c=g.localToWorld(new T.Vector3(0,u.s*.6,0));
  const d=new T.Vector3(rnd(-1,1),rnd(-.2,1),rnd(-1,1)).normalize().multiplyScalar(rnd(.5,.9));
  if(wp)d.add(wp.clone().sub(c).normalize());else d.y+=1;
  d.normalize();if(d.y<.05){d.y=.05;d.normalize()}
  RC2.set(c.clone().addScaledVector(d,u.s*4),d.clone().negate());RC2.far=u.s*8;
  const h=RC2.intersectObject(body)[0];if(!h)return;
  const n=h.face.normal.clone().transformDirection(body.matrixWorld);
  u.mark.position.copy(g.worldToLocal(h.point.clone()));
  u.mark.quaternion.setFromUnitVectors(ZV,n.applyQuaternion(g.getWorldQuaternion(new T.Quaternion()).invert()));
}
function addMark(g,s){
  const m=new T.Group(),add=t=>({map:t,transparent:true,opacity:.55,blending:T.AdditiveBlending,depthWrite:false,fog:false});
  const halo=new T.Mesh(new T.PlaneGeometry(.35,.35),new T.MeshBasicMaterial(add(HALO)));halo.raycast=()=>{};halo.userData.glow=true;halo.position.z=.02;m.add(halo);
  const spr=new T.Sprite(new T.SpriteMaterial(add(FLARE)));spr.raycast=()=>{};spr.position.z=.06;spr.scale.setScalar(.5);m.add(spr);m.userData.spr=spr;
  const h=new T.Mesh(new T.SphereGeometry(.27,8,8),new T.MeshBasicMaterial({visible:false}));h.userData.marker=true;h.userData.glow=true;m.add(h);
  g.add(m);g.userData.mark=m;g.userData.s=s;reMark(g);
}

// rocks: same size, 7 hp
const RG=new T.IcosahedronGeometry(1,1);
{const p=RG.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),l=Math.hypot(x,y,z);
  const n=1+.2*Math.sin(x*3.1+y*2.3)*Math.cos(z*2.7-x*1.3)+.1*Math.sin(y*6.1+z*5.3);p.setXYZ(i,x/l*n,y/l*n,z/l*n)}RG.computeVertexNormals()}
const TOT={s:1000,m:600,f:300},S=.9;
function mkRock(k){
  const [x,y,z]=spot(),g=new T.Group();g.position.set(x,y,z);
  const m=new T.Mesh(RG,M[k]);m.scale.set(S,S*.75,S);m.position.y=S*.5;m.rotation.y=rnd(0,6.28);g.add(m);
  g.userData={res:k,hp:7,max:7,r:S*.95,tot:TOT[k],left:TOT[k],ts:1};addMark(g,S);
  g.traverse(o=>{if(o.isMesh&&!o.userData.glow){o.castShadow=true;o.receiveShadow=true}});
  g.rotation.y=rnd(0,6.28);scene.add(g);objs.push(g);all.push(g);
}
for(let i=0;i<50;i++)mkRock('s');for(let i=0;i<25;i++)mkRock('m');for(let i=0;i<25;i++)mkRock('f');

// debris + sparks
const debris=[],DG=new T.IcosahedronGeometry(.07,0),SG=new T.SphereGeometry(.022,5,4),SM=new T.MeshBasicMaterial({color:0xffd27a,fog:false});
function burst(pos,k,w){
  for(let i=0;i<(w?3:8);i++){const d=new T.Mesh(DG,M[k]);d.position.copy(pos);d.scale.setScalar(rnd(.6,1.6));
    d.userData={v:new T.Vector3(rnd(-2,2),rnd(1.5,4),rnd(-2,2)),t:.8};scene.add(d);debris.push(d)}
  if(!w)for(let i=0;i<7;i++){const d=new T.Mesh(SG,SM);d.position.copy(pos);d.userData={v:new T.Vector3(rnd(-3,3),rnd(1,4),rnd(-3,3)),t:.3,sp:1};scene.add(d);debris.push(d)}
}

// held tools
function mkPick(o){
  const g=new T.Group(),wd=new T.MeshLambertMaterial({color:o.wood}),st=new T.MeshPhongMaterial({color:o.steel,shininess:o.shine}),
    hm=new T.MeshPhongMaterial({color:o.hub,shininess:60}),wr=new T.MeshLambertMaterial({color:o.wrap});
  g.add(new T.Mesh(new T.CylinderGeometry(.034,.03,.8,12),wd));
  const pom=new T.Mesh(new T.CylinderGeometry(.032,.05,.1,12),wd);pom.position.y=-.43;g.add(pom);
  for(let i=0;i<6;i++){const r=new T.Mesh(new T.TorusGeometry(.037,.009,6,14),wr);r.rotation.x=Math.PI/2;r.position.y=-.05+i*.022;g.add(r)}
  const head=new T.Group(),R0=o.R,A=o.A,N=8,th=o.th;
  for(const sg of [1,-1])for(let i=0;i<N;i++){
    const a0=i/N*A,a1=(i+1)/N*A,p0=new T.Vector3(0,R0*Math.cos(a0)-R0,sg*R0*Math.sin(a0)),p1=new T.Vector3(0,R0*Math.cos(a1)-R0,sg*R0*Math.sin(a1));
    const rA=th-(th-.008)*i/N,rB=th-(th-.008)*(i+1)/N,dir=p1.clone().sub(p0),c=new T.Mesh(new T.CylinderGeometry(rB,rA,dir.length(),10),st);
    c.position.copy(p0).add(p1).multiplyScalar(.5);c.quaternion.setFromUnitVectors(YV,dir.normalize());head.add(c)}
  const hz=new T.Mesh(new T.CylinderGeometry(.05,.05,.12,14),hm);hz.rotation.x=Math.PI/2;head.add(hz);
  const col=new T.Mesh(new T.CylinderGeometry(.05,.034,.12,12),hm);col.position.y=-.07;head.add(col);
  head.position.y=.4;g.add(head);return g}
const pickM=mkPick({wood:0x8b5a2b,steel:0x5f666c,shine:55,hub:0x5f666c,wrap:0xb5732c,R:.6,A:.55,th:.045});
function mkIce(){
  const g=new T.Group(),wd=new T.MeshLambertMaterial({color:0x5a3a1c}),st=new T.MeshPhongMaterial({color:0xa9d3ee,shininess:130}),gd=new T.MeshPhongMaterial({color:0xd9ab3c,shininess:70}),wr=new T.MeshLambertMaterial({color:0x2f6fb5});
  g.add(new T.Mesh(new T.CylinderGeometry(.03,.026,.74,12),wd));
  const sp=new T.Mesh(new T.ConeGeometry(.03,.12,10),st);sp.rotation.x=Math.PI;sp.position.y=-.43;g.add(sp);
  for(let i=0;i<5;i++){const r=new T.Mesh(new T.TorusGeometry(.034,.008,6,14),wr);r.rotation.x=Math.PI/2;r.position.y=-.2+i*.024;g.add(r)}
  const head=new T.Group(),R0=.55,A=.9,N=10,th=.05;
  for(let i=0;i<N;i++){const a0=i/N*A,a1=(i+1)/N*A,p0=new T.Vector3(0,R0*Math.cos(a0)-R0,-R0*Math.sin(a0)),p1=new T.Vector3(0,R0*Math.cos(a1)-R0,-R0*Math.sin(a1));
    const rA=th-(th-.004)*i/N,rB=th-(th-.004)*(i+1)/N,dir=p1.clone().sub(p0),c=new T.Mesh(new T.CylinderGeometry(rB,rA,dir.length(),10),st);
    c.position.copy(p0).add(p1).multiplyScalar(.5);c.quaternion.setFromUnitVectors(YV,dir.normalize());head.add(c)}
  const adze=new T.Mesh(new T.BoxGeometry(.03,.14,.11),st);adze.position.set(0,-.02,.1);adze.rotation.x=-.5;head.add(adze);
  const hz=new T.Mesh(new T.CylinderGeometry(.045,.045,.1,14),gd);hz.rotation.x=Math.PI/2;head.add(hz);
  const cl=new T.Mesh(new T.CylinderGeometry(.045,.03,.1,12),gd);cl.position.y=-.06;head.add(cl);
  head.position.y=.37;g.add(head);return g}
const iceM=mkIce();
const drillM=new T.Group();let drillBit=null;
{const om=new T.MeshPhongMaterial({color:0xe0801c,shininess:40}),dk=new T.MeshPhongMaterial({color:0x3a3f44,shininess:30}),bm=new T.MeshPhongMaterial({color:0xaeb4ba,shininess:90});
 
 
 
 
 const hm=(c,sh)=>new T.MeshPhongMaterial({color:c,shininess:sh||40});
 const ad=(g,m,x,y,z,rx)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);if(rx)o.rotation.x=rx;drillM.add(o);return o};
 const orange=hm(0xe8821e,50),black=hm(0x24282c,30),steelM=hm(0xb8bec4,100),yel=hm(0xf2c230,40);
 ad(new T.CylinderGeometry(.075,.075,.34,18),orange,0,0,.06,Math.PI/2);
 ad(new T.CylinderGeometry(.079,.079,.05,18),black,0,0,.24,Math.PI/2);
 ad(new T.CylinderGeometry(.06,.075,.09,18),black,0,0,-.15,-Math.PI/2);
 ad(new T.BoxGeometry(.05,.19,.07),black,0,-.14,.1).rotation.x=.2;
 ad(new T.BoxGeometry(.012,.04,.02),yel,0,-.08,.05);
 ad(new T.BoxGeometry(.11,.07,.15),black,0,-.25,.12);
 ad(new T.BoxGeometry(.112,.02,.152),orange,0,-.225,.12);
 ad(new T.CylinderGeometry(.014,.014,.15,8),black,-.09,-.05,-.05).rotation.z=1;
 ad(new T.CylinderGeometry(.05,.05,.07,14),steelM,0,0,-.22,Math.PI/2);
 const bg=new T.Group();bg.position.z=-.255;bg.rotation.x=-Math.PI/2;drillM.add(bg);
 const spin=new T.Group();bg.add(spin);drillBit=spin;
 const core=new T.Mesh(new T.ConeGeometry(.026,.4,10),steelM);core.position.y=.2;spin.add(core);
 const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push(new T.Vector3(Math.cos(t*Math.PI*7)*.03*(1-t*.75),t*.38,Math.sin(t*Math.PI*7)*.03*(1-t*.75)))}
 spin.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),60,.009,6),steelM))}
const T3={pick:pickM,axe:iceM,drill:drillM};for(const q in T3){T3[q].visible=false;cam.add(T3[q])}

// merchant stall (center of the map)
{const st=new T.Group();st.position.set(0,H(0,0)-.05,0);
 const ad=(g,c,x,y,z)=>{const o=new T.Mesh(g,new T.MeshLambertMaterial({color:c,flatShading:true}));o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;st.add(o);return o};
 ad(new T.BoxGeometry(3.2,1.05,.9),0x7a5230,0,.52,1);ad(new T.BoxGeometry(3.4,.1,1.1),0x9a6b3a,0,1.08,1);

  // tool swing
  cool-=dt;if(holdHit&&live)hit();let k=0;
  if(swing>0){swing=Math.max(0,swing-dt*swRate);const t=1-swing,e=x=>x*x*(3-2*x);k=t<.3?-.8*e(t/.3):t<.45?-.8+2*e((t-.3)/.15):1.2*(1-e((t-.45)/.55))}
  act=actTool();const cur=act?T3[act]:null;for(const q in T3)T3[q].visible=(T3[q]===cur);
  if(cur){if(act==='drill'){const j=swing>0?Math.sin(now*90)*.006:0;cur.rotation.set(-.04-k*.06,-.12,.04);cur.position.set(.38+j,-.4+j,-.75-k*.1);drillBit.rotation.y+=swing>0?dt*40:dt*3}
    else{cur.rotation.set(-.2-k*.7,.1,.3-k*.12);cur.position.set(.45-k*.06,-.55-k*.06,-.8-k*.08)}}
  for(const o of all){const u=o.userData;
    u.mark.userData.spr.scale.setScalar(.5+Math.sin(now*6+o.id)*.06);
    if(u.shake>0){u.shake-=dt;o.rotation.z=Math.sin(now*60)*u.shake*.1}else if(!u.fall)o.rotation.z=0;
    if(u.fall>0){u.fall-=dt;o.scale.setScalar(Math.max(.01,u.fs*u.fall/.45));if(u.fall<=0){o.visible=false;u.fall=0;u.respawn=25}}
    else if(!u.respawn&&Math.abs(o.scale.x-u.ts)>.002)o.scale.setScalar(o.scale.x+(u.ts-o.scale.x)*Math.min(1,dt*10));
    if(u.respawn>0){u.respawn-=dt;if(u.respawn<=0){u.respawn=0;u.ts=1;o.visible=true;o.scale.setScalar(1);o.rotation.z=0;u.hp=u.max;u.left=u.tot;reMark(o);objs.push(o)}}
  }
  for(let i=debris.length-1;i>=0;i--){const d=debris[i],u=d.userData;u.t-=dt;if(u.sp)d.scale.setScalar(Math.max(.01,u.t/.3*1.4));u.v.y-=12*dt;d.position.addScaledVector(u.v,dt);if(u.t<=0){scene.remove(d);debris.splice(i,1)}}
  near=Math.hypot(P.pos.x,P.pos.z-1)<2.9;shopBtn.style.display=near&&live?'block':'none';
  if(tt>0){tt-=dt;if(tt<=0)toast.style.opacity=0}
  sun.position.set(P.pos.x+60,P.pos.y+90,P.pos.z+40);sun.target.position.copy(P.pos);
  R.render(scene,cam);
}
loop();
</script>
