<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rust-like: Фарм</title>
<style>
:root{--bg:#0e1116;--fg:#f2efe6;--ac:#ff9a2e;--panel:rgba(14,17,22,.68)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;user-select:none}
canvas{display:block;width:100%;height:100%}
#cross{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none}
#cross i{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);border-radius:1px;transition:background .1s}
#cross .t{width:2px;height:7px;left:-1px;top:-13px}#cross .b{width:2px;height:7px;left:-1px;top:6px}
#cross .l{width:7px;height:2px;left:-13px;top:-1px}#cross .r{width:7px;height:2px;left:6px;top:-1px}
#cross .d{width:2px;height:2px;left:-1px;top:-1px}
#cross.hit i{background:var(--ac)}
#toast{position:fixed;left:50%;top:58%;transform:translateX(-50%);font-weight:700;font-size:20px;color:var(--ac);text-shadow:0 1px 3px #000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#top{position:fixed;right:12px;top:12px;font-size:12px;opacity:.8;text-align:right;padding-top:env(safe-area-inset-top,0px);text-shadow:0 1px 2px #000}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}
.hs{position:relative;width:56px;height:56px;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:26px}
.hs.on{border-color:var(--ac);box-shadow:0 0 8px rgba(255,154,46,.5)}
.hs u{position:absolute;left:4px;top:2px;font-size:10px;text-decoration:none;opacity:.6}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,16,.72);text-align:center;cursor:pointer}
#ov h1{font-size:44px;margin:0 0 8px;letter-spacing:.04em;color:var(--ac)}#ov p{margin:4px;opacity:.85}
#inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.6);backdrop-filter:blur(3px)}
#inv .box{background:rgba(22,26,33,.96);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:18px 22px;max-width:94vw;max-height:88vh;overflow:auto}
#inv h2{margin:0 0 12px;font-size:20px}#inv h2 small{font-weight:400;opacity:.5;font-size:12px;margin-left:8px}
#grid{display:grid;grid-template-columns:repeat(6,72px);gap:6px}
.sl{position:relative;height:72px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px}
.sl em{font-style:normal;font-size:10px;opacity:.75;margin-top:3px}
.sl i{position:absolute;right:5px;bottom:2px;font-style:normal;font-size:10px;font-weight:700;color:var(--ac)}
.sl.e{opacity:.4}
.ic{width:34px;height:30px;clip-path:polygon(15% 12%,60% 0,100% 30%,90% 80%,50% 100%,5% 78%)}
html,body{touch-action:none}
#tc{display:none}
#joy{display:none;position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:none}
#knob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(14,17,22,.55);border:2px solid rgba(255,255,255,.35);color:#fff}
#bHit{right:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:88px;height:88px;font-size:34px;background:rgba(255,154,46,.55)}
#bJump{right:128px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:60px;height:60px;font-size:22px}
#bInv{right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:50px;height:50px;font-size:22px}
@media(max-width:520px){#grid{grid-template-columns:repeat(4,64px)}.sl{height:64px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
<div id="toast"></div>
<div id="bar"><div class="hs on"><u>1</u>⛏️</div><div class="hs"><u>2</u></div><div class="hs"><u>3</u></div><div class="hs"><u>4</u></div><div class="hs"><u>5</u></div><div class="hs"><u>6</u></div></div>
<div id="inv"><div class="box"><h2>Инвентарь<small>Tab — закрыть</small></h2><div id="grid"></div></div></div>
<div id="ov"><h1>RUST FARM</h1><p>Кликни, чтобы начать фармить</p><p style="font-size:13px;opacity:.6">Если мышь не захватывается — зажми ЛКМ и води, чтобы смотреть</p></div>
<div id="tc"><div id="joy"><div id="knob"></div></div><div id="bHit" class="tb">⛏️</div><div id="bJump" class="tb">▲</div><div id="bInv" class="tb">🎒</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE, cv=document.getElementById('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputEncoding=T.sRGBEncoding;
const scene=new T.Scene();scene.background=new T.Color(0x9cc7e8);scene.fog=new T.Fog(0x9cc7e8,40,190);
const cam=new T.PerspectiveCamera(70,1,.1,400);scene.add(cam);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new T.HemisphereLight(0xcfe6ff,0x4a5a3a,.8));
const sun=new T.DirectionalLight(0xfff0d0,1.1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-45;sc.right=sc.top=45;sc.far=200;sun.shadow.bias=-.0005;scene.add(sun,sun.target);

// terrain
const H=(x,z)=>Math.sin(x*.02)*4+Math.cos(z*.025)*4+Math.sin((x+z)*.05)*2.5+Math.sin(x*.09)*Math.cos(z*.08);
const WATER=-3.5;
{
  const g=new T.PlaneGeometry(400,400,160,160);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,col=[],c=new T.Color();
  for(let i=0;i<p.count;i++){
    const y=H(p.getX(i),p.getZ(i));p.setY(i,y);const n=Math.random()*.06;
    if(y<WATER+1)c.setHSL(.12,.45,.55+n);else if(y>8)c.setHSL(.08,.1,.45+n);else c.setHSL(.27-y*.004,.5,.3+n);
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new T.Float32BufferAttribute(col,3));g.computeVertexNormals();
  const t=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true}));t.receiveShadow=true;scene.add(t);
  const w=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshPhongMaterial({color:0x2a6f9e,transparent:true,opacity:.8,shininess:90}));
  w.rotation.x=-Math.PI/2;w.position.y=WATER;scene.add(w);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function spot(){for(;;){const x=rnd(-180,180),z=rnd(-180,180),y=H(x,z);if(y>WATER+.8&&Math.hypot(x,z)>6)return[x,y,z]}}
const rock=c=>new T.MeshStandardMaterial({color:c,roughness:.95,metalness:0,flatShading:true});
const M={trunk:new T.MeshLambertMaterial({color:0x5a3b22}),leaf:[0x2f6b2f,0x3a7d34,0x275a2a].map(c=>new T.MeshLambertMaterial({color:c,flatShading:true})),
 s:rock(0x8d8d88),m:rock(0x9a5b2e),f:rock(0xd6c640)};
const objs=[],all=[],trees=[];

for(let i=0;i<150;i++){ // decor trees
  const [x,y,z]=spot(),g=new T.Group();g.position.set(x,y,z);
  const h=rnd(4,7),tr=new T.Mesh(new T.CylinderGeometry(.3,.45,h,7),M.trunk);tr.position.y=h/2;g.add(tr);
  for(let k=0;k<3;k++){const c=new T.Mesh(new T.ConeGeometry(2.4-k*.6,3,8),M.leaf[k%3]);c.position.y=h-.5+k*1.5;g.add(c)}
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});g.rotation.y=rnd(0,6.28);scene.add(g);trees.push(g);
}

// weak spot: glowing flare like in Rust
const tex=fn=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');fn(x);return new T.CanvasTexture(c)};
const FLARE=tex(x=>{x.globalCompositeOperation='lighter';
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,235,1)');g.addColorStop(.12,'rgba(255,225,140,.95)');g.addColorStop(.35,'rgba(255,150,40,.35)');g.addColorStop(1,'rgba(255,120,20,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  [0,Math.PI/2,.62,-.62].forEach((a,i)=>{x.save();x.translate(64,64);x.rotate(a);const l=x.createLinearGradient(-64,0,64,0);
    l.addColorStop(0,'rgba(255,200,120,0)');l.addColorStop(.5,'rgba(255,240,200,'+(i<2?.9:.55)+')');l.addColorStop(1,'rgba(255,200,120,0)');
    x.fillStyle=l;x.fillRect(-64,-1.3,128,2.6);x.restore()})});
const HALO=tex(x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,170,60,.9)');g.addColorStop(.4,'rgba(255,120,30,.35)');g.addColorStop(1,'rgba(255,100,20,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});
const RC2=new T.Raycaster(),ZV=new T.Vector3(0,0,1);
function reMark(g,wp){ // put marker on the surface, near previous spot
  g.updateMatrixWorld(true);const u=g.userData,body=g.children[0];
  const c=g.localToWorld(new T.Vector3(0,u.s*.6,0));
  const d=new T.Vector3(rnd(-1,1),rnd(-.2,1),rnd(-1,1)).normalize().multiplyScalar(rnd(.5,.9));
  if(wp)d.add(wp.clone().sub(c).normalize());else d.y+=1;
  d.normalize();if(d.y<.05){d.y=.05;d.normalize()}
  RC2.set(c.clone().addScaledVector(d,u.s*4),d.clone().negate());RC2.far=u.s*8;
  const h=RC2.intersectObject(body)[0];if(!h)return;
  const n=h.face.normal.clone().transformDirection(body.matrixWorld);
  u.mark.position.copy(g.worldToLocal(h.point.clone()));
  u.mark.quaternion.setFromUnitVectors(ZV,n.applyQuaternion(g.getWorldQuaternion(new T.Quaternion()).invert()));
}
function addMark(g,s){
  const m=new T.Group(),add=t=>({map:t,transparent:true,opacity:.55,blending:T.AdditiveBlending,depthWrite:false,fog:false});
  const halo=new T.Mesh(new T.PlaneGeometry(.35,.35),new T.MeshBasicMaterial(add(HALO)));halo.raycast=()=>{};halo.userData.glow=true;halo.position.z=.02;m.add(halo);
  const spr=new T.Sprite(new T.SpriteMaterial(add(FLARE)));spr.raycast=()=>{};spr.position.z=.06;spr.scale.setScalar(.5);m.add(spr);m.userData.spr=spr;
  const h=new T.Mesh(new T.SphereGeometry(.27,8,8),new T.MeshBasicMaterial({visible:false}));h.userData.marker=true;h.userData.glow=true;m.add(h);
  g.add(m);g.userData.mark=m;g.userData.s=s;reMark(g);
}

// rocks: all the same size, 4 stages (4 hits)
const RG=new T.IcosahedronGeometry(1,1);
{const p=RG.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),l=Math.hypot(x,y,z);
  const n=1+.2*Math.sin(x*3.1+y*2.3)*Math.cos(z*2.7-x*1.3)+.1*Math.sin(y*6.1+z*5.3);p.setXYZ(i,x/l*n,y/l*n,z/l*n)}RG.computeVertexNormals()}
const TOT={s:1000,m:600,f:300},STAGE=[1,.91,.82,.73,.64,.55,.46],S=.9;
function mkRock(k){
  const [x,y,z]=spot(),g=new T.Group();g.position.set(x,y,z);
  const m=new T.Mesh(RG,M[k]);m.scale.set(S,S*.75,S);m.position.y=S*.5;m.rotation.y=rnd(0,6.28);g.add(m);
  g.userData={res:k,hp:7,max:7,r:S*.95,tot:TOT[k],left:TOT[k],ts:1};addMark(g,S);
  g.traverse(o=>{if(o.isMesh&&!o.userData.glow){o.castShadow=true;o.receiveShadow=true}});
  g.rotation.y=rnd(0,6.28);scene.add(g);objs.push(g);all.push(g);
}
for(let i=0;i<50;i++)mkRock('s');for(let i=0;i<25;i++)mkRock('m');for(let i=0;i<25;i++)mkRock('f');

// debris
const debris=[],DG=new T.IcosahedronGeometry(.07,0),SG=new T.SphereGeometry(.022,5,4),SM=new T.MeshBasicMaterial({color:0xffd27a,fog:false});
function burst(pos,k){for(let i=0;i<8;i++){const d=new T.Mesh(DG,M[k]);d.position.copy(pos);d.scale.setScalar(rnd(.6,1.6));
  d.userData={v:new T.Vector3(rnd(-2,2),rnd(1.5,4),rnd(-2,2)),t:.8};scene.add(d);debris.push(d)}
  for(let i=0;i<7;i++){const d=new T.Mesh(SG,SM);d.position.copy(pos);d.userData={v:new T.Vector3(rnd(-3,3),rnd(1,4),rnd(-3,3)),t:.3,sp:1};scene.add(d);debris.push(d)}}

// pickaxe
const tool=new T.Group();
const wood=new T.MeshLambertMaterial({color:0x8b5a2b}),steel=new T.MeshPhongMaterial({color:0x5f666c,shininess:55}),wrap=new T.MeshLambertMaterial({color:0xb5732c});
tool.add(new T.Mesh(new T.CylinderGeometry(.034,.03,.8,12),wood));
const pom=new T.Mesh(new T.CylinderGeometry(.032,.05,.1,12),wood);pom.position.y=-.43;tool.add(pom);
for(let i=0;i<6;i++){const r=new T.Mesh(new T.TorusGeometry(.037,.009,6,14),wrap);r.rotation.x=Math.PI/2;r.position.y=-.05+i*.022;tool.add(r)}

const head=new T.Group();
const R0=.6,A=.55,N=8,YV=new T.Vector3(0,1,0);
for(const sg of [1,-1])for(let i=0;i<N;i++){
  const a0=i/N*A,a1=(i+1)/N*A,p0=new T.Vector3(0,R0*Math.cos(a0)-R0,sg*R0*Math.sin(a0)),p1=new T.Vector3(0,R0*Math.cos(a1)-R0,sg*R0*Math.sin(a1));
  const rA=.045-.037*i/N,rB=.045-.037*(i+1)/N,dir=p1.clone().sub(p0),c=new T.Mesh(new T.CylinderGeometry(rB,rA,dir.length(),10),steel);
  c.position.copy(p0).add(p1).multiplyScalar(.5);c.quaternion.setFromUnitVectors(YV,dir.normalize());head.add(c)}

const hubZ=new T.Mesh(new T.CylinderGeometry(.05,.05,.12,14),steel);hubZ.rotation.x=Math.PI/2;head.add(hubZ);
const collar=new T.Mesh(new T.CylinderGeometry(.05,.034,.12,12),steel);collar.position.y=-.07;head.add(collar);
head.position.y=.4;tool.add(head);cam.add(tool);


// state
const P={pos:new T.Vector3(0,H(0,0)+1.7,0),vy:0,yaw:0,pitch:0,ground:true};
const keys={};let started=false,drag=false,swing=0,cool=0,step=0,invOpen=false;
const inv={s:0,m:0,f:0},NM={s:'камня',m:'металла',f:'серы'},LB={s:'Камень',m:'Металл',f:'Сера'},CL={s:'#9a9a94',m:'#b8692f',f:'#e2d24a'};
const toast=document.getElementById('toast'),ov=document.getElementById('ov'),invEl=document.getElementById('inv'),crossEl=document.getElementById('cross');let tt=0;
function say(t){toast.textContent=t;toast.style.opacity=1;tt=.8}
const used=k=>Math.ceil(inv[k]/1000);
function capLeft(k){let o=1;for(const j of ['s','m','f'])if(j!==k)o+=used(j);return Math.max(0,(24-o)*1000-inv[k])}
function renderInv(){
  const it=[['<span>⛏️</span>','Кирка','']];
  for(const k of ['s','m','f']){let c=inv[k];while(c>0){it.push([`<div class="ic" style="background:${CL[k]}"></div>`,LB[k],Math.min(c,1000)]);c-=1000}}
  let h='';for(let i=0;i<24;i++){const s=it[i];h+=s?`<div class="sl">${s[0]}<em>${s[1]}</em>${s[2]!==''?'<i>'+s[2]+'</i>':''}</div>`:'<div class="sl e"></div>'}
  document.getElementById('grid').innerHTML=h;
}
function toggleInv(){invOpen=!invOpen;invEl.style.display=invOpen?'flex':'none';
  if(invOpen){renderInv();try{document.exitPointerLock()}catch(e){}}
  else{try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}sfx('ui')}

// audio
let AC,master,noiseBuf;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const w=AC.createBufferSource();w.buffer=noiseBuf;w.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
    const g=AC.createGain();g.gain.value=.05;w.connect(f);f.connect(g);g.connect(master);w.start();
    setInterval(()=>{if(started&&Math.random()<.5)bird()},3500);
  }catch(e){AC=null}
}
function noise(ft,fr,dur,vol,fr2){const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(fr,t);
  if(fr2)f.frequency.exponentialRampToValueAtTime(fr2,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(0,Math.random()*.5,dur)}
function tone(type,fr,dur,vol,fr2){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(fr,t);
  if(fr2)o.frequency.exponentialRampToValueAtTime(fr2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start();o.stop(t+dur)}
function bird(){if(!AC)return;const n=2+Math.floor(Math.random()*3),b=2500+Math.random()*1500;for(let i=0;i<n;i++)setTimeout(()=>tone('sine',b,.09,.05,b*1.3),i*130)}
function sfx(k){if(!AC)return;try{switch(k){
  case 'swing':noise('bandpass',1300,.14,.12,300);break;
  case 'rock':noise('highpass',2500,.12,.6);tone('square',520,.06,.12,200);break;
  case 'ore':tone('triangle',1800,.4,.3,1500);tone('square',2400,.2,.06);noise('highpass',4000,.07,.35);break;
  case 'sul':noise('highpass',3000,.16,.5);tone('triangle',900,.1,.15,500);break;
  case 'crit':tone('sine',880,.25,.25);setTimeout(()=>tone('sine',1320,.35,.2),70);break;
  case 'miss':tone('sine',120,.14,.5,55);noise('lowpass',400,.1,.35);break;
  case 'break':noise('lowpass',600,.5,.9,120);tone('sawtooth',90,.4,.3,40);break;
  case 'step':noise('lowpass',450+Math.random()*250,.07,.3);break;
  case 'jump':tone('sine',200,.12,.15,420);break;
  case 'ui':tone('sine',520,.05,.1);break}}catch(e){}}

addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();
  if((e.code==='Tab'||e.code==='KeyI')&&!e.repeat){e.preventDefault();if(started||invOpen)toggleInv()}});
addEventListener('keyup',e=>keys[e.code]=false);
function look(dx,dy){P.yaw-=dx*.0025;P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-dy*.0025))}
addEventListener('mousemove',e=>{if(!started||invOpen)return;if(document.pointerLockElement===cv||drag)look(e.movementX,e.movementY)});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousedown',e=>{
  initAudio();if(invOpen)return;
  if(!started){started=true;ov.style.display='none';try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}return}
  drag=true;hit();
});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&started&&!invOpen){started=false;ov.style.display='flex'}});
const rc=new T.Raycaster();rc.far=3;
function hit(){
  if(cool>0||invOpen)return;swing=1;cool=1;sfx('swing');setTimeout(strike,350)}
function strike(){if(invOpen)return;
  rc.setFromCamera({x:0,y:0},cam);
  const hs=rc.intersectObjects(objs,true);if(!hs.length)return;
  let o=hs[0].object;while(o&&!o.userData.res)o=o.parent;if(!o)return;
  const u=o.userData;u.shake=.2;
  if(!hs[0].object.userData.marker){sfx('miss');return}
  if(capLeft(u.res)<=0){say('Инвентарь полон');return}u.hp--;let n=u.hp<=0?u.left:Math.min(u.left,Math.round(u.tot/u.max*rnd(.85,1.15)));u.left-=n;n=Math.min(n,capLeft(u.res));inv[u.res]+=n;if(invOpen)renderInv();
  sfx({s:'rock',m:'ore',f:'sul'}[u.res]);sfx('crit');say('+'+n+' '+NM[u.res]);
  crossEl.classList.add('hit');setTimeout(()=>crossEl.classList.remove('hit'),150);
  const mp=u.mark.getWorldPosition(new T.Vector3());burst(mp,u.res);
  if(u.hp<=0){u.fall=.45;u.fs=o.scale.x;objs.splice(objs.indexOf(o),1);sfx('break')}
  else{u.ts=STAGE[u.max-u.hp];reMark(o,mp)}
}

// ---- mobile controls ----
const isTouch=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const joy={x:0,y:0},tc=document.getElementById('tc'),jEl=document.getElementById('joy'),kEl=document.getElementById('knob');
let holdHit=false,jt=null,jo=null,lt=null;
if(isTouch){
  document.getElementById('bar').style.display='none';
  const ps=ov.querySelectorAll('p');ps[0].textContent='Нажми, чтобы начать фармить';ps[1].textContent='Левый палец — идти, правый — смотреть';
  const tStart=e=>{e.preventDefault();initAudio();
    for(const t of e.changedTouches){const el=t.target;
      if(!started&&!invOpen){started=true;ov.style.display='none';tc.style.display='block';continue}
      if(el.closest&&el.closest('#bInv')){toggleInv();continue}
      if(invOpen){if(el===invEl)toggleInv();continue}
      if(el.closest&&el.closest('#bHit')){holdHit=true;hit();continue}
      if(el.closest&&el.closest('#bJump')){keys.Space=true;continue}
      if(t.clientX<innerWidth*.45&&jt===null){jt=t.identifier;jo={x:t.clientX,y:t.clientY};jEl.style.display='block';jEl.style.left=(jo.x-60)+'px';jEl.style.top=(jo.y-60)+'px';kEl.style.transform='translate(0,0)'}
      else if(lt===null)lt={id:t.identifier,x:t.clientX,y:t.clientY}}};
  const tMove=e=>{e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier===jt){let dx=t.clientX-jo.x,dy=t.clientY-jo.y;const m=Math.hypot(dx,dy),mx=50;if(m>mx){dx*=mx/m;dy*=mx/m}
        kEl.style.transform='translate('+dx+'px,'+dy+'px)';const nx=dx/mx,ny=dy/mx,dz=Math.hypot(nx,ny)<.18;joy.x=dz?0:nx;joy.y=dz?0:ny}
      else if(lt&&t.identifier===lt.id&&started&&!invOpen){look((t.clientX-lt.x)*1.8,(t.clientY-lt.y)*1.8);lt.x=t.clientX;lt.y=t.clientY}}};
  const tEnd=e=>{e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier===jt){jt=null;joy.x=joy.y=0;jEl.style.display='none'}
      if(lt&&t.identifier===lt.id)lt=null}
    let h=false,j=false;for(const t of e.touches){const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.closest){if(el.closest('#bHit'))h=true;if(el.closest('#bJump'))j=true}}
    holdHit=h;keys.Space=j};
  addEventListener('touchstart',tStart,{passive:false});addEventListener('touchmove',tMove,{passive:false});
  addEventListener('touchend',tEnd,{passive:false});addEventListener('touchcancel',tEnd,{passive:false});
}
const clock=new T.Clock();
function push(o,r){const dx=P.pos.x-o.position.x,dz=P.pos.z-o.position.z,d=Math.hypot(dx,dz),m=r+.4;
  if(d<m&&d>0){P.pos.x=o.position.x+dx/d*m;P.pos.z=o.position.z+dz/d*m}}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),now=clock.elapsedTime,live=started&&!invOpen;
  if(live){
    const jm=Math.hypot(joy.x,joy.y),sp=5.5,f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
    const l=Math.hypot(f,s)||1,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
    P.pos.x+=(-sy*f+cy*s)/l*sp*dt*(f||s?1:0);P.pos.z+=(-cy*f-sy*s)/l*sp*dt*(f||s?1:0);
    P.pos.x=Math.max(-195,Math.min(195,P.pos.x));P.pos.z=Math.max(-195,Math.min(195,P.pos.z));
    let gh=Math.max(H(P.pos.x,P.pos.z),WATER-.6);const fy=P.pos.y-1.7;
    for(const o of objs){const q=o.scale.x,Rr=o.userData.r*q,top=o.position.y+q*.95,d=Math.hypot(P.pos.x-o.position.x,P.pos.z-o.position.z);
      if(fy>=top-.3){if(d<Rr)gh=Math.max(gh,o.position.y+q*(.1+.85*Math.sqrt(1-d*d/(Rr*Rr))))}else push(o,Rr)}
    for(const o of trees)push(o,.7);
    const gy=gh+1.7;
    if(keys.Space&&P.ground){P.vy=7;P.ground=false;sfx('jump')}
    P.vy-=20*dt;P.pos.y+=P.vy*dt;
    if(P.pos.y<=gy){P.pos.y=gy;P.vy=0;P.ground=true}
  }
  const moving=live&&P.ground&&(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||joy.x||joy.y);
  const bob=moving?Math.sin(now*10)*.04:0;
  if(moving){step-=dt;if(step<=0){step=.42;sfx('step')}}
  cam.position.set(P.pos.x,P.pos.y+bob,P.pos.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ');
  // pickaxe swing: wind-up, strike, recover
  cool-=dt;if(holdHit&&live)hit();let k=0;
  if(swing>0){swing=Math.max(0,swing-dt*1.3);const t=1-swing,e=x=>x*x*(3-2*x);k=t<.3?-.8*e(t/.3):t<.45?-.8+2*e((t-.3)/.15):1.2*(1-e((t-.45)/.55))}
  tool.rotation.set(-.2-k*.7,.1,.3-k*.12);tool.position.set(.45-k*.06,-.55-k*.06,-.8-k*.08);
  for(const o of all){const u=o.userData;
    u.mark.userData.spr.scale.setScalar(.5+Math.sin(now*6+o.id)*.06);
    if(u.shake>0){u.shake-=dt;o.rotation.z=Math.sin(now*60)*u.shake*.1}else if(!u.fall)o.rotation.z=0;
    if(u.fall>0){u.fall-=dt;o.scale.setScalar(Math.max(.01,u.fs*u.fall/.45));if(u.fall<=0){o.visible=false;u.fall=0;u.respawn=25}}
    else if(!u.respawn&&Math.abs(o.scale.x-u.ts)>.002)o.scale.setScalar(o.scale.x+(u.ts-o.scale.x)*Math.min(1,dt*10));
    if(u.respawn>0){u.respawn-=dt;if(u.respawn<=0){u.respawn=0;u.ts=1;o.visible=true;o.scale.setScalar(1);o.rotation.z=0;u.hp=u.max;u.left=u.tot;reMark(o);objs.push(o)}}
  }
  for(let i=debris.length-1;i>=0;i--){const d=debris[i],u=d.userData;u.t-=dt;if(u.sp)d.scale.setScalar(Math.max(.01,u.t/.3*1.4));u.v.y-=12*dt;d.position.addScaledVector(u.v,dt);if(u.t<=0){scene.remove(d);debris.splice(i,1)}}
  if(tt>0){tt-=dt;if(tt<=0)toast.style.opacity=0}
  sun.position.set(P.pos.x+60,P.pos.y+90,P.pos.z+40);sun.target.position.copy(P.pos);
  R.render(scene,cam);
}
loop();
</script>
